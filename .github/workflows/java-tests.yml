name: Run Java Tests                 # WORKFLOW

on:                                  # EVENT (TRIGGER)
  push:                              # EVENT
  workflow_dispatch:                 # EVENT

jobs:                                # JOB
  test:                              # JOB
    runs-on: ubuntu-latest           # RUNNER

    strategy:
      matrix:
        java-version: ["8", "17"]

    steps:                           # STEPS
      - uses: actions/checkout@v4    # ACTION
      - uses: actions/setup-java@v4  # ACTION
        with:                        # STEP
          distribution: temurin      # STEP
          java-version: ${{ matrix.java-version }}         # STEP
          cache: maven               # STEP
          
      - run: mvn test                # STEP
